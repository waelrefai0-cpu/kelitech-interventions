services:
  - type: web
    name: kelitech-interventions
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run db:push && npm run db:seed && npm run start --workspace backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kelitech-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: UPLOAD_DIR
        value: uploads
      - key: NODE_VERSION
        value: 24

databases:
  - name: kelitech-postgres
    plan: free
    databaseName: kelitech_interventions
    user: kelitech
